name: CI
on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config --global user.email "ci@kyzn.local"
          git config --global user.name "KyZN CI"
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
          # Pin yq version + checksum (matches install.sh)
          YQ_VERSION="v4.52.4"
          YQ_CHECKSUM="0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c"
          wget -qO /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_CHECKSUM}  /tmp/yq" | sha256sum -c --strict || { echo "yq checksum mismatch — aborting"; exit 1; }
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          rm -f /tmp/yq
      - name: Run quick tests
        run: bash tests/selftest.sh
      - name: Run full tests
        run: bash tests/selftest.sh --full

  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config --global user.email "ci@kyzn.local"
          git config --global user.name "KyZN CI"
      - name: Install dependencies
        run: |
          brew install jq
          # Pin yq version + checksum (matches install.sh)
          YQ_VERSION="v4.52.4"
          case "$(uname -m)" in
            arm64) YQ_PLATFORM="darwin_arm64"; YQ_CHECKSUM="6bfa43a439936644d63c70308832390c8838290d064970eaada216219c218a13" ;;
            x86_64) YQ_PLATFORM="darwin_amd64"; YQ_CHECKSUM="d72a75fe9953c707d395f653d90095b133675ddd61aa738e1ac9a73c6c05e8be" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          YQ_BIN="$RUNNER_TEMP/bin/yq"
          curl -fsSL -o "$YQ_BIN" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${YQ_PLATFORM}"
          echo "${YQ_CHECKSUM}  ${YQ_BIN}" | shasum -a 256 -c -
          chmod 755 "$YQ_BIN"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run quick tests
        run: bash tests/selftest.sh
      - name: Run full tests
        run: bash tests/selftest.sh --full
