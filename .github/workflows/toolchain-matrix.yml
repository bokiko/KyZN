name: Toolchain Matrix

# Real-toolchain integration coverage for the languages the mocked selftest
# suite can only simulate. Separate from ci.yml because these jobs install SDKs
# and reach the network, so they are slower and are not run on every push.
#
# Every action is pinned to an immutable commit SHA. SDK and runtime versions
# (Node, .NET SDK, JDK, Gradle) are pinned HERE, in the setup steps below;
# fixture dependency versions (typescript, xunit, junit, surefire) are pinned in
# tests/toolchain/run-matrix.sh.
#
# The harness takes two independent flags:
#   --require          a missing toolchain fails the job instead of skipping it
#   --allow-downloads  authorizes fetching the pinned fixture dependencies
# They are separate on purpose: strictness must not imply network access.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/verify.sh'
      - 'lib/detect.sh'
      - 'measurers/**'
      - 'tests/toolchain/**'
      - '.github/workflows/toolchain-matrix.yml'

# Read-only. No packages, no releases, no writes of any kind.
permissions:
  contents: read

concurrency:
  group: toolchain-matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 5.x is the incumbent compiler; 7.x is the native port, whose CLI is
        # the more likely source of a surprise. Both must behave identically
        # through node_modules/.bin/tsc.
        typescript: ['5.9.3', '7.0.2']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.23.1'
      - name: Run TypeScript suite
        env:
          KYZN_TS_VERSION: ${{ matrix.typescript }}
        run: bash tests/toolchain/run-matrix.sh --require --allow-downloads typescript

  dotnet:
    name: .NET
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '10.0.302'
      - name: Run .NET suite
        env:
          DOTNET_NOLOGO: 'true'
          DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
        run: bash tests/toolchain/run-matrix.sh --require --allow-downloads dotnet

  java-maven:
    name: Java / Maven
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20+8'
      - name: Run Maven suite
        run: bash tests/toolchain/run-matrix.sh --require --allow-downloads maven

  java-gradle:
    name: Java / Gradle (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 'gradle' proves the system binary is used when no wrapper exists;
        # 'gradle-wrapper' proves ./gradlew wins when both are available.
        mode: ['gradle', 'gradle-wrapper']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '17.0.20+8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1
        with:
          gradle-version: '9.6.1'
          cache-disabled: true
      - name: Run Gradle suite
        # Matrix values are author-controlled literals, but keep them out of the
        # shell interpolation position on principle.
        env:
          SUITE: ${{ matrix.mode }}
        run: bash tests/toolchain/run-matrix.sh --require --allow-downloads "$SUITE"
